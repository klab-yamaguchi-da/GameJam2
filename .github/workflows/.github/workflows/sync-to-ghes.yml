name: Sync to GhES

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags
      
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SYNC_DEPLOY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "エラー: SYNC_DEPLOY シークレットが設定されていません"
            echo "リポジトリの Settings > Secrets and variables > Actions でシークレットを設定してください"
            exit 1
          fi
          
          echo "SSH設定を開始します..."
          mkdir -p ~/.ssh
          
          echo "SSH秘密鍵を設定中..."
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          echo "SSH鍵のフィンガープリントを確認:"
          if ssh-keygen -l -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "SSH鍵の検証に成功しました"
          else
            echo "警告: SSH鍵の検証に失敗しました"
          fi
          
          echo "ホストキーをスキャン中: github.jp.klab.com"
          if ! ssh-keyscan github.jp.klab.com >> ~/.ssh/known_hosts 2>&1; then
            echo "エラー: ssh-keyscanが失敗しました"
            exit 1
          fi
          
          echo "known_hostsにエントリが追加されました（$(wc -l < ~/.ssh/known_hosts)行）"
          
          echo "SSH設定が完了しました"
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Add remote and push
        run: |
          git remote get-url ghes 2>/dev/null || git remote add ghes git@github.jp.klab.com:yamaguchi-da/Gamejam2.git
          git fetch ghes main || true
          git push ghes main --force-with-lease
