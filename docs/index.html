<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドンキーコング - GameJam2</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-instructions">
        <h2>遊び方</h2>
        <div class="instructions-content">
            <div class="instruction-item">
                <span class="instruction-key">← →</span>
                <span class="instruction-desc">左右移動</span>
            </div>
            <div class="instruction-item">
                <span class="instruction-key">スペース</span>
                <span class="instruction-desc">ジャンプ</span>
            </div>
            <div class="instruction-item">
                <span class="instruction-key">↑ ↓</span>
                <span class="instruction-desc">はしご昇降</span>
            </div>
        </div>
    </div>
    <div id="game-container">
        <div id="title-screen" class="screen active">
            <h1>ドンキーコング</h1>
            <p>方向キー: 移動</p>
            <p>スペース: ジャンプ</p>
            <p>上下キー: はしご登り</p>
            <button id="start-button">スタート</button>
        </div>
        
        <div id="game-screen" class="screen">
            <div id="game-ui">
                <div id="score">SCORE: <span id="score-value">0</span></div>
                <div id="lives">LIVES: <span id="lives-value">3</span></div>
                <div id="level">LEVEL: <span id="level-value">1</span></div>
            </div>
            <canvas id="game-canvas" width="800" height="600"></canvas>
        </div>
        
        <div id="game-over-screen" class="screen">
            <h1>ゲームオーバー</h1>
            <p>スコア: <span id="final-score">0</span></p>
            <button id="restart-button">もう一度プレイ</button>
        </div>
        
        <div id="stage-clear-screen" class="screen">
            <h1>ステージクリア！</h1>
            <p>スコア: <span id="stage-score">0</span></p>
            <button id="next-stage-button">次のステージへ</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/player.js"></script>
    <script src="js/barrel.js"></script>
    <script src="js/donkeykong.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
